<!DOCTYPE html>
<html>
<head>
    <title>SmartTools API</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            text-align: center;
            margin: 0;
            padding: 60px;
        }

        .box {
            background: rgba(30, 41, 59, 0.9);
            padding: 30px;
            border-radius: 16px;
            display: inline-block;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        .nav {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div class="nav">
        <a href="/">Home</a> |
        <a href="/docs">Docs</a> |
        <a href="/health">Health</a> |
        <a href="/ai/suggest?query=code">AI</a>
    </div>

    {% block content %}{% endblock %}

</body>
</html>
